<div class="container mt-5">
    <h2>{{ isEditMode ? 'Edit' : 'Create' }} Exam Question</h2>
    <form [formGroup]="examQuestionForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="questionText" class="form-label">Question Text</label>
        <textarea id="questionText" formControlName="questionText" class="form-control" rows="4"></textarea>
      </div>
      <button type="submit" class="btn btn-success" [disabled]="examQuestionForm.invalid">
        {{ isEditMode ? 'Update' : 'Create' }}
      </button>
    </form>
  </div>
