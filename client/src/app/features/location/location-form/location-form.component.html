<div class="container mt-5">
    <h2>{{ isEditMode ? 'Edit' : 'Create' }} Location</h2>
    <form [formGroup]="locationForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" formControlName="name" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" id="address" formControlName="address" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="city" class="form-label">City</label>
        <input type="text" id="city" formControlName="city" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="state" class="form-label">State</label>
        <input type="text" id="state" formControlName="state" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="zipCode" class="form-label">Zip Code</label>
        <input type="text" id="zipCode" formControlName="zipCode" class="form-control" />
      </div>
      <button type="submit" class="btn btn-success" [disabled]="locationForm.invalid">
        {{ isEditMode ? 'Update' : 'Create' }}
      </button>
    </form>
  </div>
