<div class="container mt-5">
    <h2>Users</h2>
    <table class="table table-dark table-striped mt-4">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>
            <a [routerLink]="['/user', user.id]" class="btn btn-sm btn-primary">View</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
