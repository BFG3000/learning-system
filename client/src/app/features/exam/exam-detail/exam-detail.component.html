<div class="container mt-5" *ngIf="exam">
    <h2>Exam Details</h2>
    <p><strong>ID:</strong> {{ exam.id }}</p>
    <p><strong>Name:</strong> {{ exam.name }}</p>
    <p><strong>Start Date:</strong> {{ exam.startDate }}</p>
    <p><strong>End Date:</strong> {{ exam.endDate }}</p>
    <p><strong>Location:</strong> {{ exam.locationId }}</p>
  </div>
