<div class="container mt-5">
    <h2>{{ isEditMode ? 'Edit' : 'Create' }} Exam Variant</h2>
    <form [formGroup]="examVariantForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" formControlName="name" class="form-control" />
      </div>
  
      <div class="mb-3">
        <label for="examDefinitionId" class="form-label">Exam Definition</label>
        <select id="examDefinitionId" formControlName="examDefinitionId" class="form-control">
          <option *ngFor="let examDef of examDefinitions" [value]="examDef.id">{{ examDef.name }}</option>
        </select>
      </div>
  
      <div class="mb-3">
        <label for="examQuestions" class="form-label">Select Exam Questions</label>
        <select multiple id="examQuestions" formControlName="examQuestions" class="form-control">
          <option *ngFor="let question of examQuestions" [value]="question.id">{{ question.questionText }}</option>
        </select>
      </div>
  
      <button type="submit" class="btn btn-success" [disabled]="examVariantForm.invalid">
        {{ isEditMode ? 'Update' : 'Create' }}
      </button>
    </form>
  </div>
