<div class="container mt-5">
    <h2>{{ isEditMode ? 'Edit' : 'Create' }} Exam Definition</h2>
    <form [formGroup]="examDefinitionForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" formControlName="name" class="form-control" />
      </div>
  
      <div class="mb-3">
        <label for="categoryId" class="form-label">Category</label>
        <select id="categoryId" formControlName="categoryId" class="form-control">
          <option *ngFor="let category of categories" [value]="category.id">{{ category.name }}</option>
        </select>
      </div>
  
      <div class="mb-3">
        <label for="duration" class="form-label">Duration (in minutes)</label>
        <input type="number" id="duration" formControlName="duration" class="form-control" />
      </div>
  
      <div class="mb-3">
        <label for="examTypeId" class="form-label">Exam Type</label>
        <select id="examTypeId" formControlName="examTypeId" class="form-control">
          <option *ngFor="let examType of examTypes" [value]="examType.id">{{ examType.name }}</option>
        </select>
      </div>
  
      <button type="submit" class="btn btn-success" [disabled]="examDefinitionForm.invalid">
        {{ isEditMode ? 'Update' : 'Create' }}
      </button>
    </form>
  </div>
