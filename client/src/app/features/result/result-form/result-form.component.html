<div class="container mt-5">
    <h2>{{ isEditMode ? 'Edit' : 'Create' }} Result</h2>
    <form [formGroup]="resultForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="score" class="form-label">Score</label>
        <input type="number" id="score" formControlName="score" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="userExamId" class="form-label">User Exam ID</label>
        <input type="text" id="userExamId" formControlName="userExamId" class="form-control" />
      </div>
      <button type="submit" class="btn btn-success" [disabled]="resultForm.invalid">
        {{ isEditMode ? 'Update' : 'Create' }}
      </button>
    </form>
  </div>
